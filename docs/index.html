<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#066e50">
  <title>Club Aguirre · Infantil Femenino 26/27</title>
  <meta name="description" content="Partidos, disponibilidad, convocatoria y clasificación del Infantil Femenino del Club Aguirre (fútbol sala, 2026-27).">
  <meta name="color-scheme" content="dark light">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="Club Aguirre · Infantil Femenino 26/27">
  <meta property="og:description" content="Partidos, disponibilidad, convocatoria y clasificación.">
  <meta property="og:url" content="https://mauzam11.github.io/clubAguirreInfantilFem2627/">
  <meta property="og:image" content="https://mauzam11.github.io/clubAguirreInfantilFem2627/assets/icono-512.png">
  <link rel="icon" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/icono-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("aguirre-tema");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="wrap hero-inner">
      <img src="assets/logo.png" alt="Club Aguirre" class="logo" width="92" height="44">
      <div class="titulo">
        <p class="eyebrow">Fútbol sala · Temporada 2026-27</p>
        <h1>Infantil Femenino</h1>
      </div>
      <button id="btn-tema" class="btn-icono" type="button" aria-label="Cambiar a modo oscuro" title="Cambiar a modo oscuro">
        <svg class="ic-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="ic-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button id="btn-entrenadora" class="btn-icono" type="button" aria-pressed="false" aria-label="Acceso entrenadora" title="Acceso entrenadora">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </button>
    </div>
    <nav class="wrap tabs" role="tablist" aria-label="Secciones">
      <button class="tab activa" role="tab" id="tab-partidos" aria-selected="true" aria-controls="lista" type="button" data-vista="partidos">Partidos</button>
      <button class="tab" role="tab" id="tab-clasif" aria-selected="false" tabindex="-1" aria-controls="clasificacion" type="button" data-vista="clasificacion">Clasificación</button>
      <button class="tab" role="tab" id="tab-conv" aria-selected="false" tabindex="-1" aria-controls="convocatorias" type="button" data-vista="convocatorias" hidden>Convocatorias</button>
    </nav>
  </header>

  <main class="wrap">
    <div class="mi-fila" id="mi-fila">
      <label for="mi-jugadora">Mi jugadora</label>
      <select id="mi-jugadora"></select>
    </div>
    <div class="estado-fila">
      <span id="estado" class="estado" role="status"></span>
      <span id="pill-ent" class="pill" hidden>Modo entrenadora</span>
    </div>
    <section id="lista" class="lista" aria-live="polite" role="tabpanel" aria-labelledby="tab-partidos"></section>
    <section id="clasificacion" class="clasif" role="tabpanel" aria-labelledby="tab-clasif" hidden></section>
    <section id="convocatorias" class="clasif" role="tabpanel" aria-labelledby="tab-conv" hidden></section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p><strong>Club Aguirre</strong> | Escuela de Deportes</p>
      <p><a href="https://clubaguirre.es/futbol-sala/" rel="noopener">clubaguirre.es</a></p>
    </div>
  </footer>

  <dialog id="dlg-pin" aria-labelledby="dlg-titulo">
    <form method="dialog" id="form-pin">
      <h2 id="dlg-titulo">Acceso entrenadora</h2>
      <label for="pin">Introduce el PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
      <p id="pin-error" class="error" role="alert" hidden>PIN incorrecto</p>
      <div class="dlg-actions">
        <button type="button" class="btn btn-ghost" id="pin-cancel">Cancelar</button>
        <button type="submit" class="btn">Entrar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="data.js"></script>
  <script src="datos-liga.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
